name: Train emergency model

# Trains on GitHub's free CPU runners, so no GPU or Colab is needed.
# Start it from the Actions tab (Run workflow), or push to the
# `train-emergency` branch. The weights come back as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Stop training after this many hours (max about 5)"
        default: "4.5"
      imgsz:
        description: "Image size (smaller is faster)"
        default: "640"
  push:
    branches: [train-emergency]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch keeps this small and fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "ultralytics>=8.1" "opencv-python-headless" numpy pandas pillow
      - name: Train, then score on the validation and test images
        run: |
          python scripts/train_emergency.py --device cpu --batch 16 --epochs 100 \
            --imgsz "${{ github.event.inputs.imgsz || '640' }}" \
            --time "${{ github.event.inputs.hours || '4.5' }}" \
            --report emergency_scores.json | tee train.log
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-model
          path: |
            models/emergency_vehicle.pt
            emergency_scores.json
            train.log
            runs/detect/emergency_vehicle/results.csv
            runs/detect/emergency_vehicle/results.png
            runs/detect/emergency_vehicle/confusion_matrix.png
          if-no-files-found: warn
          retention-days: 30
