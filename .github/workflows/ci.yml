name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies
        run: pip install pytest numpy pandas pillow python-dotenv opencv-python-headless streamlit twilio
      - name: Unit tests (stand-in detectors, no model weights)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t traffic-agent .
      - name: Real YOLO + ByteTrack smoke test inside the image
        run: docker run --rm -e APP_ENV= traffic-agent python scripts/check_setup.py --full
