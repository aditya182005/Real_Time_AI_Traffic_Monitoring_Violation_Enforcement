[theme]
# Pine and terracotta on warm stone. Custom pieces: app/ui/theme.py.
base = "light"
primaryColor = "#B8481F"
backgroundColor = "#F6F2ED"
secondaryBackgroundColor = "#EBE4DC"
textColor = "#1C2426"
font = "sans serif"

[server]
# Largest file a user may upload, in MB.
maxUploadSize = 200
# Do not try to open a browser (servers, containers).
headless = true

[browser]
gatherUsageStats = false
