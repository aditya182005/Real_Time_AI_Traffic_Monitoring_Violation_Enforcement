[theme]
# Night-sign control room: pearl page, navy and teal. Custom pieces: app/ui/theme.py.
base = "light"
primaryColor = "#0B7F8B"
backgroundColor = "#F1F4F8"
secondaryBackgroundColor = "#E4EAF2"
textColor = "#0B1B30"
font = "sans serif"

[server]
# Largest file a user may upload, in MB.
maxUploadSize = 200
# Do not try to open a browser (servers, containers).
headless = true

[browser]
gatherUsageStats = false
