# oauth2-proxy in front of Traffic Agent: people sign in with Google (or
# GitHub, Microsoft, ...) and the app gets their email in a header.
# See https://oauth2-proxy.github.io/oauth2-proxy/ for every option.
#
# In the app's .env:
#   AUTH_MODE=proxy
#   AUTH_PROXY_HEADER=X-Forwarded-Email
#   AUTH_PROXY_ADMINS=you@example.com
#   AUTH_PROXY_OPERATORS=teammate@example.com
#   (everyone else allowed by the proxy is a viewer)
#
# IMPORTANT: the app must be reachable ONLY through this proxy (bind it to
# 127.0.0.1 or a private Docker network). Otherwise anyone can send the
# header themselves and sign in as anybody.

http_address      = "0.0.0.0:4180"
upstreams         = ["http://traffic-agent:8501/"]
provider          = "google"
client_id         = "YOUR_CLIENT_ID"
client_secret     = "YOUR_CLIENT_SECRET"      # prefer the environment variable
cookie_secret     = "GENERATE_WITH: openssl rand -base64 32 | tr -- '+/' '-_'"
cookie_secure     = true
redirect_url      = "https://traffic.example.com/oauth2/callback"
email_domains     = ["example.com"]           # or authenticated_emails_file
set_xauthrequest  = true                      # sends X-Forwarded-Email
pass_user_headers = true
reverse_proxy     = true
