# Optional: ban addresses that keep failing to sign in, using the app's own
# log (the data folder's logs/traffic_agent.log).
#
# /etc/fail2ban/filter.d/traffic-agent.conf  (this file's [Definition])
# /etc/fail2ban/jail.d/traffic-agent.local   (the jail below)
#
# The audit lines look like:
#   ... audit action=login_failed user=alice role=None address=1.2.3.4 ...

[Definition]
failregex = audit action=login_(failed|blocked) .* address=<HOST>
ignoreregex =

# [traffic-agent]
# enabled  = true
# filter   = traffic-agent
# logpath  = /var/lib/docker/volumes/<project>_traffic_data/_data/logs/traffic_agent.log
# maxretry = 10
# findtime = 10m
# bantime  = 1h
