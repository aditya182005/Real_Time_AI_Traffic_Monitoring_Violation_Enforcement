# Paste into: Streamlit Community Cloud -> your app -> Settings -> Secrets.
# Top-level keys become environment variables, exactly like .env.

APP_ENV = "production"          # the app then refuses to show anything without sign-in
DASHBOARD_PASSWORD = "change-me-to-12-or-more-characters"
DASHBOARD_PASSWORD_ROLE = "admin"   # viewer, operator or admin

DEMO_HOSTING = "1"              # shows "records are erased on restart" in the sidebar
TRAFFIC_AGENT_DATA_DIR = "/tmp/traffic-agent"

# Optional alerts (leave out to keep them off)
# TWILIO_ACCOUNT_SID = ""
# TWILIO_AUTH_TOKEN = ""
# TWILIO_PHONE_NUMBER = ""
# ALERT_TO_PHONE = ""
# TELEGRAM_BOT_TOKEN = ""
# TELEGRAM_CHAT_ID = ""
