# nginx reverse proxy with HTTPS and rate limiting. Put this in
# /etc/nginx/conf.d/traffic-agent.conf and fill in the domain and certificates
# (for example with certbot).

# 60 requests/minute/IP for the app; the websocket counts once when it opens.
limit_req_zone $binary_remote_addr zone=traffic_app:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=traffic_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name traffic.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name traffic.example.com;

    ssl_certificate     /etc/letsencrypt/live/traffic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traffic.example.com/privkey.pem;

    client_max_body_size 210m;

    location / {
        limit_req  zone=traffic_app burst=40 nodelay;
        limit_conn traffic_conn 20;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;

        # Overwrite, never append: the app uses this address to rate-limit
        # logins, and a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 86400;
    }
}
